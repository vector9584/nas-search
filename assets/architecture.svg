<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="920" height="420" fill="#0d1117"/>
  <text x="30" y="42" fill="#e6edf3" font-size="20" font-weight="600">nas-search 索引与查询链路</text>
  <text x="30" y="66" fill="#7d8590" font-size="13">预建 FTS5 索引，查询时不碰磁盘遍历</text>

  <!-- 上半：索引构建 -->
  <text x="30" y="110" fill="#58a6ff" font-size="13" font-weight="600">① 建索引（一次性 / 定时）</text>
  <rect x="30" y="124" width="176" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="118" y="152" fill="#e6edf3" font-size="13" text-anchor="middle">os.walk 全盘遍历</text>
  <text x="118" y="174" fill="#7d8590" font-size="11" text-anchor="middle">/vol1 /vol2 /vol3 /vol4</text>

  <rect x="248" y="124" width="196" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="346" y="148" fill="#e6edf3" font-size="13" text-anchor="middle">剪枝：SKIP_ANY / SKIP_ROOT</text>
  <text x="346" y="168" fill="#7d8590" font-size="11" text-anchor="middle">@eaDir .@#local node_modules</text>
  <text x="346" y="184" fill="#7d8590" font-size="11" text-anchor="middle">前缀目录只在卷根剪，避免误杀</text>

  <rect x="486" y="124" width="200" height="70" rx="8" fill="#161b22" stroke="#238636"/>
  <text x="586" y="148" fill="#7ee787" font-size="13" text-anchor="middle">index.db（SQLite FTS5）</text>
  <text x="586" y="168" fill="#7d8590" font-size="11" text-anchor="middle">files_fts(name, path)</text>
  <text x="586" y="184" fill="#7d8590" font-size="11" text-anchor="middle">写 .tmp 后 mv，避免锁冲突</text>

  <rect x="728" y="124" width="162" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="809" y="152" fill="#e6edf3" font-size="13" text-anchor="middle">WAL checkpoint</text>
  <text x="809" y="172" fill="#7d8590" font-size="11" text-anchor="middle">TRUNCATE，防丢尾批</text>

  <line x1="206" y1="159" x2="242" y2="159" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
  <line x1="444" y1="159" x2="480" y2="159" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
  <line x1="686" y1="159" x2="722" y2="159" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

  <!-- 下半：查询 -->
  <text x="30" y="248" fill="#f0883e" font-size="13" font-weight="600">② 查询（毫秒级）</text>
  <rect x="728" y="262" width="162" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="809" y="288" fill="#e6edf3" font-size="13" text-anchor="middle">浏览器搜索框</text>
  <text x="809" y="308" fill="#7d8590" font-size="11" text-anchor="middle">飞牛桌面微应用</text>

  <rect x="486" y="262" width="200" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="586" y="286" fill="#e6edf3" font-size="13" text-anchor="middle">fnOS 网关 /app/nas-search</text>
  <text x="586" y="306" fill="#7d8590" font-size="11" text-anchor="middle">剥离 GATEWAY_PREFIX</text>
  <text x="586" y="322" fill="#7d8590" font-size="11" text-anchor="middle">转发到 Unix socket</text>

  <rect x="248" y="262" width="196" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="346" y="286" fill="#e6edf3" font-size="13" text-anchor="middle">server.py（stdlib）</text>
  <text x="346" y="306" fill="#7d8590" font-size="11" text-anchor="middle">UnixStreamServer + 自带 HTTP</text>
  <text x="346" y="322" fill="#7d8590" font-size="11" text-anchor="middle">零第三方依赖</text>

  <rect x="30" y="262" width="176" height="70" rx="8" fill="#161b22" stroke="#238636"/>
  <text x="118" y="286" fill="#7ee787" font-size="13" text-anchor="middle">MATCH 查询 + 分页</text>
  <text x="118" y="306" fill="#7d8590" font-size="11" text-anchor="middle">name MATCH 二次过滤</text>
  <text x="118" y="322" fill="#7d8590" font-size="11" text-anchor="middle">只命中文件名，不命中路径</text>

  <line x1="728" y1="297" x2="692" y2="297" stroke="#f0883e" stroke-width="2" marker-end="url(#b)"/>
  <line x1="486" y1="297" x2="450" y2="297" stroke="#f0883e" stroke-width="2" marker-end="url(#b)"/>
  <line x1="248" y1="297" x2="212" y2="297" stroke="#f0883e" stroke-width="2" marker-end="url(#b)"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#58a6ff"/></marker>
    <marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f0883e"/></marker>
  </defs>
  <text x="30" y="396" fill="#7d8590" font-size="11">注：查询走内存索引，不做磁盘遍历 —— 这是「找文件不再等」的全部原因。</text>
</svg>